# Sample production reverse proxy for GTMX. Two sites, one backend:
#
#   app.gtmx.co  the app (frontend/dist); /api, including the discovery
#                WebSocket, goes to the FastAPI backend on 127.0.0.1:8000.
#   gtmx.co      the waitlist page (waitlist/dist); only /api/v1/waitlist is
#                proxied, so the public site exposes nothing else.
#
# Both use relative /api URLs on their own origin, so no CORS is required.
# This file belongs in nginx's http{} context (e.g. /etc/nginx/conf.d/).
#
# Usage:
#   1. Builds:   cd frontend && bun install && bun run build → dist/
#                cd waitlist && bun install && bun run build → dist/
#   2. Backend:  uvicorn backend.app.main:app --host 127.0.0.1 --port 8000
#   3. TLS:      certbot --nginx -d gtmx.co -d www.gtmx.co -d app.gtmx.co
#   4. Adapt paths below, then:   nginx -t && systemctl reload nginx
#
# The backend limits waitlist signups per IP from X-Real-IP, which nginx sets
# below and overwrites whatever a client sends.

# A first line of defence for the public signup form; the backend's per-IP
# hourly limit is the real one.
limit_req_zone $binary_remote_addr zone=waitlist:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name app.gtmx.co;

    root /var/www/gtmx/frontend;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Long-lived discovery WebSocket + agent HTTP calls. Keep timeouts high:
    # a single agent turn can run for minutes while it scrapes and calls the LLM.
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Hashed build assets are immutable and cacheable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all other routes serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.gtmx.co;
    return 301 https://gtmx.co$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name gtmx.co;

    root /var/www/gtmx/waitlist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/v1/waitlist {
        limit_req zone=waitlist burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Nothing else of the API is public on the landing domain.
    location /api {
        return 404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # A one-page site: unknown paths get the page.
    location / {
        try_files $uri /index.html;
    }
}
