# Sample production reverse proxy for GTMX.
#
# Serves the built frontend (frontend/dist) and proxies /api — including the
# discovery WebSocket — to the FastAPI backend on 127.0.0.1:8000. Because the
# frontend always uses relative /api URLs, no CORS is required in this setup.
#
# Usage:
#   1. Frontend build:   cd frontend && bun install && bun run build → dist/
#   2. Backend:          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000
#   3. Adapt paths below, then:   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name gtmx.example.com;

    root /var/www/gtmx/frontend;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Long-lived discovery WebSocket + agent HTTP calls. Keep timeouts high:
    # a single agent turn can run for minutes while it scrapes and calls the LLM.
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Hashed build assets are immutable and cacheable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all other routes serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}