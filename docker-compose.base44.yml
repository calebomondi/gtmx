# Base44 development environment for GTMX.
#
# Single-origin wiring: only port 3000 (the Vite dev server) is public. The
# frontend proxies /api — including the discovery WebSocket — to the FastAPI
# backend on the internal docker network, so no CORS is needed and cookie/
# session auth would work unchanged.
#
# The backend uses SQLite (blog.db) in development — no external database
# service is required. The agent runtime shares the same SQLite file for
# LangGraph checkpoints.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - /run/base44/app.env
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
    volumes:
      - ./:/app
    # uv sync installs from uv.lock on every startup (after the bind mount is
    # available), then execs uvicorn with live reload scoped to the Python
    # source dirs so SQLite WAL / Vite asset writes don't bounce the server.
    command:
      - sh
      - -ec
      - |
        uv sync --frozen
        exec uv run uvicorn backend.app.main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --reload \
          --reload-dir backend \
          --reload-dir agents \
          --reload-dir utils \
          --reload-dir data_sources \
          --reload-dir supabase
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure

  frontend:
    image: oven/bun:1
    working_dir: /app/frontend
    volumes:
      - ./:/app
    environment:
      # Proxy /api to the backend service on the docker network (vite.config.ts
      # reads this; defaults to http://localhost:8000 for non-docker local dev).
      - API_PROXY_TARGET=http://backend:8000
      # Vite >= 6.1 appends this platform-provided host to its allowedHosts list.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - |
        bun install --frozen-lockfile
        exec bun run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "3000:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure
