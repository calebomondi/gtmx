services:
  hotel:
    image: oven/bun:1-alpine
    working_dir: /app
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun run dev"]
    volumes:
      - ./hotel:/app
      - hotel_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    labels:
      base44.project: "DERFED DELICASIES"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: on-failure

volumes:
  hotel_node_modules:
