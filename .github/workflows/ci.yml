name: CI

on:
  pull_request:          # every PR, including ones stacked on other branches
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which apps the change touches; each job below runs only for its own. A
  # skipped job counts as passed, so required checks don't wait on it. Pushes
  # to dev/main (releases) run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend }}
      waitlist: ${{ github.event_name == 'push' || steps.filter.outputs.waitlist }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci: &ci
              - .github/workflows/**
            backend:
              - *ci
              - agents/**
              - backend/**
              - data_sources/**
              - utils/**
              - config.py
              - pyproject.toml
              - uv.lock
              - alembic.ini
            frontend:
              - *ci
              - frontend/**
            waitlist:
              - *ci
              - waitlist/**

  backend:
    name: Backend (migrations + tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gtmx
          POSTGRES_PASSWORD: gtmx
          POSTGRES_DB: gtmx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gtmx -d gtmx"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://gtmx:gtmx@localhost:5432/gtmx
      TEST_DATABASE_URL: postgresql://gtmx:gtmx@localhost:5432/gtmx_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Migrations round-trip on an empty database
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Models match migrations (no drift)
        run: uv run alembic check

      - name: Tests (offline)
        run: uv run pytest

  frontend:
    name: Frontend (lint + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  waitlist:
    name: Waitlist page (lint + build)
    needs: changes
    if: needs.changes.outputs.waitlist == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waitlist
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
